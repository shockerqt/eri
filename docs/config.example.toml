mode = "development"
issuer = "http://127.0.0.1:18082"
bind = "127.0.0.1:18082"

[database]
# Prefer ERI_DATABASE_URL in the service environment. A URL may be placed here,
# but this file must then be treated as a secret and kept outside Git.
url_env = "ERI_DATABASE_URL"
max_connections = 10
min_connections = 1
connect_timeout_seconds = 5
acquire_timeout_seconds = 5
readiness_timeout_milliseconds = 500

[signing]
manifest = "keys/manifest.json"

# Adding [authorization] enables the complete first-party provider surface and
# requires the named Google secret environment variable at startup.
# [authorization.google]
# client_id = "google-client-id.apps.googleusercontent.com"
# client_secret_env = "ERI_GOOGLE_CLIENT_SECRET"
#
# [[authorization.clients]]
# id = "balance-web"
# display_name = "Balance"
# scopes = ["openid", "profile", "email", "offline_access"]
# resources = ["https://api.example/resource"]
# default_resource = "https://api.example/resource"
# browser_origins = ["https://app.example"]
# post_logout_redirects = ["https://app.example/signed-out"]
# redirects = [{ uri = "https://app.example/oauth/callback", kind = "exact" }]
# authorization_flow = "interactive" # safe default when omitted
# logout_flow = "interactive" # independent safe default; reviewed static-only exception: id_token_hint
# See docs/logout.md for bearer-replay risk before opting in.
# Set "google_preauthorized" only after the operator explicitly approves this
# static client's configured scopes and resources, including offline_access.
# The selected redirect must also have kind = "app_claimed_https", backed by
# verified domain association and the actual signed native application. This is
# an operator assertion, not automatic association verification by Eri. Ordinary
# exact HTTPS and custom-scheme redirects remain interactive for that client.
# Only requests for declared resources qualify; add the issuer's /userinfo
# resource explicitly if direct OIDC-only authorization is intended.
#
# CIMD remains disabled unless this explicit table is added. Review the server's
# scope/resource authority before enabling it; metadata grants neither authority
# nor browser origins, logout redirects, or a default resource.
# [authorization.cimd]
# scopes = ["openid", "offline_access"]
# resources = ["https://api.example/mcp"]
# allow_refresh = false # omitted also means false; true still requires metadata
#                       # refresh_token declaration and explicit offline consent.
