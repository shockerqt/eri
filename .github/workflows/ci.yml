name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eri_inf008_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eri_inf008_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eri_inf008_test
      ERI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eri_inf008_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make lint
      - run: make test
        env:
          ERI_PROVIDER_PROOF_CONTAINER: ${{ job.services.postgres.id }}
      - name: Provision pinned synthetic browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/eri-browser" --no-save --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/eri-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify consent callbacks across chained origins
        run: |
          ERI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/eri-browser/node_modules/playwright" \
            cargo test --locked web::tests::chromium_follows_bound_consent_and_logout_redirects -- --ignored --nocapture
      - run: make build
      - name: Package identified binary
        run: |
          mkdir -p artifact
          cp target/release/eri artifact/eri
          cp target/release/examples/staging-benchmark artifact/eri-benchmark
          git rev-parse HEAD > artifact/SOURCE_SHA
          rustc -vV | sed -n 's/^host: //p' > artifact/RUST_TARGET
          (cd artifact && sha256sum eri eri-benchmark > SHA256SUMS)
          (cd artifact && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: eri-linux-aarch64-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifact/
          if-no-files-found: error
