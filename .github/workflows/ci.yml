name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eri_inf008_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eri_inf008_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eri_inf008_test
      ERI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eri_inf008_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make lint
      - run: make test
      - run: make build
      - name: Package identified binary
        run: |
          mkdir -p artifact
          cp target/release/eri artifact/eri
          git rev-parse HEAD > artifact/SOURCE_SHA
          rustc -vV | sed -n 's/^host: //p' > artifact/RUST_TARGET
          (cd artifact && sha256sum eri > SHA256SUMS)
          (cd artifact && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: eri-linux-aarch64-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifact/
          if-no-files-found: error
